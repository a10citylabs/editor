[package]
name = "imagecore"
version = "0.1.0"
edition = "2021"
description = "WebAssembly image processing core for the A10city Image Editor"
license = "MIT"
repository = "https://github.com/a10citylabs/editor"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Codec layer: decode/encode for the popular raster formats. rayon is left out
# on purpose - wasm32-unknown-unknown has no threads without a cross-origin
# isolated SharedArrayBuffer setup, and pulling it in only bloats the module.
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }

# SIMD-accelerated resampling. This is the single biggest performance lever in
# the whole pipeline: its convolution kernels are hand-vectorised for wasm
# simd128 and run several times faster than image's own `resize`.
fast_image_resize = { version = "6", features = ["image"] }

# Classical computer-vision operators (affine warps, separable Gaussian,
# unsharp masking). Pure Rust, so it compiles to wasm unlike the OpenCV
# bindings - see README for the reasoning.
imageproc = { version = "0.27", default-features = false }

# --- Content Credentials (C2PA) ---------------------------------------------
# The claim generator is written against the C2PA 2.2 specification directly
# rather than pulling in `c2pa-rs`: that crate carries a full trust-list and
# OCSP stack this proof of concept has no use for, and its wasm story goes
# through a different toolchain than `wasm-bindgen`. What is left is small
# enough to read - deterministic CBOR, JUMBF boxes and COSE_Sign1.
#
# Note what is *not* here: no `getrandom` and no clock. Neither exists on
# wasm32-unknown-unknown without a shim, so the host passes in the time and the
# random bytes it already has from `crypto.getRandomValues`. That also makes
# every test in this crate reproducible.
sha2 = { version = "0.10", default-features = false }
# `std` is deliberately off. It would switch on `rand_core/getrandom`, and
# `getrandom` 0.2 does not build for wasm32-unknown-unknown without a JavaScript
# shim. Nothing here needs an RNG - ECDSA signing is deterministic per RFC 6979,
# and the UUIDs come from the host - so the honest fix is to drop the dependency
# rather than to shim a random number generator this crate never calls.
p256 = { version = "0.13", default-features = false, features = [
    "ecdsa",
    "pem",
] }

wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["panic-hook"]
panic-hook = ["dep:console_error_panic_hook"]

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
